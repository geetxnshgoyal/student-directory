<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yearbook | NST Bangalore</title>
    <link rel="stylesheet" href="yearbook.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..900,60,1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script>
        // Set before first paint so there is no flash of the wrong theme. Shares
        // the cp_theme key with the carpool and the admin portal.
        (function () {
            try {
                var saved = localStorage.getItem('cp_theme');
                document.documentElement.dataset.theme = saved
                    || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            } catch (e) {
                document.documentElement.dataset.theme = 'dark';
            }
        })();
    </script>
</head>

<body>

    <!-- ============ SIGN IN ============ -->
    <div id="auth-view" class="view active">
        <div class="auth-wrap">
            <div class="auth-card">
                <div class="auth-mark">
                    <img src="devforge-mark.png" alt="" width="30" height="30">
                </div>
                <p class="eyebrow">NST Bangalore</p>
                <h1 class="auth-heading">The Yearbook</h1>
                <p class="auth-blurb">Your batch, in one place. Sign in with the same code you use for the carpool.</p>

                <form id="login-form" class="auth-step active" novalidate>
                    <div class="field">
                        <label for="usn-input">Serial number (USN)</label>
                        <input type="text" id="usn-input" placeholder="2102508748" maxlength="10" inputmode="numeric"
                            pattern="[0-9]{10}" autocomplete="username" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Send code</button>
                    <p class="status-msg" id="login-status" role="status" aria-live="polite"></p>
                </form>

                <form id="otp-form" class="auth-step" novalidate>
                    <div class="step-head">
                        <button type="button" id="back-to-login" class="btn-icon" aria-label="Back">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" aria-hidden="true">
                                <path d="M19 12H5M12 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <div>
                            <p class="eyebrow">Step 2 of 2</p>
                            <h2 class="auth-title">Enter your code</h2>
                        </div>
                    </div>
                    <p class="auth-sub">Sent to <span id="email-hint" class="mono">your college email</span></p>
                    <div class="field">
                        <label for="otp-input">6-digit code</label>
                        <input type="text" id="otp-input" placeholder="000000" maxlength="6" required
                            inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" class="otp-field">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Verify and continue</button>
                    <p class="status-msg" id="otp-status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- ============ THE WALL ============ -->
    <div id="book-view" class="view">
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="/carpool">
                    <img class="brand-glyph" src="devforge-mark.png" alt="" width="26" height="26">
                    <span class="brand-name">NST Yearbook</span>
                </a>
                <div class="topbar-right">
                    <a class="btn-link topbar-link" href="/carpool">Carpool</a>
                    <button type="button" class="btn-icon" data-theme-toggle aria-label="Switch theme">
                        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                        </svg>
                        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                        </svg>
                    </button>
                    <button type="button" id="signout-btn" class="btn-link">Sign out</button>
                </div>
            </div>
        </header>

        <main class="page">

            <!-- Your own page -->
            <section class="mine" aria-labelledby="mine-heading">
                <div class="mine-portrait">
                    <img id="me-photo" alt="" hidden>
                    <span id="me-initial" class="portrait-initial" aria-hidden="true"></span>
                </div>
                <div class="mine-body">
                    <p class="eyebrow">Your page</p>
                    <h2 id="mine-heading" class="mine-name">&nbsp;</h2>
                    <p id="me-quote" class="mine-quote quiet">You haven't written your line yet.</p>
                    <div class="mine-actions">
                        <button type="button" id="edit-me-btn" class="btn btn-primary btn-sm">Edit your page</button>
                        <button type="button" id="review-btn" class="btn btn-ghost btn-sm">
                            Notes for you
                            <span id="pending-badge" class="badge" hidden>0</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- The batch -->
            <section class="wall" aria-labelledby="wall-heading">
                <div class="wall-head">
                    <h2 id="wall-heading" class="section-title">The batch</h2>
                    <span id="count-label" class="count mono"></span>
                </div>

                <div class="filters">
                    <div class="search-field">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M21 21l-4.2-4.2" />
                        </svg>
                        <input type="search" id="search-input" placeholder="Search by name" aria-label="Search by name">
                    </div>
                    <select id="batch-filter" aria-label="Filter by batch">
                        <option value="">All batches</option>
                    </select>
                </div>

                <div id="wall-grid" class="wall-grid" aria-busy="true"></div>
                <p id="wall-empty" class="empty" hidden>Nobody matches that.</p>
            </section>
        </main>
    </div>

    <!-- ============ PANEL ============ -->
    <div id="panel" class="panel-backdrop" hidden>
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
            <button type="button" id="panel-close" class="panel-close" aria-label="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    aria-hidden="true">
                    <path d="M18 6L6 18M6 6l12 12" />
                </svg>
            </button>
            <div id="panel-body"></div>
        </div>
    </div>

    <script src="yearbook.js"></script>
</body>

</html>
